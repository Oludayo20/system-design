services:
  postgres:
    image: postgres:16-alpine
    container_name: eshop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eshop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eshop}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eshop} -d ${POSTGRES_DB:-eshop}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eshop

  redis:
    image: redis:7-alpine
    container_name: eshop-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eshop

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: eshop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-eshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-eshop_dev_password}
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - eshop

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eshop-api
    environment:
      NODE_ENV: production
      PORT: 3000
      # Use Docker service names — not localhost from .env (which is for host-side dev).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-eshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eshop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eshop}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-eshop}:${RABBITMQ_PASSWORD:-eshop_dev_password}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_please}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eshop
    command:
      - sh
      - -c
      - |
        echo "Waiting for postgres DNS and TCP..."
        i=0
        until node -e "
          const dns = require('dns');
          const net = require('net');
          dns.lookup('postgres', (err, addr) => {
            if (err) process.exit(1);
            const s = net.createConnection(5432, addr, () => { s.end(); process.exit(0); });
            s.on('error', () => process.exit(1));
          });
        "; do
          i=$$((i + 1))
          if [ $$i -ge 60 ]; then echo "postgres not reachable after 60s"; exit 1; fi
          sleep 1
        done
        node ./node_modules/typeorm/cli.js migration:run -d dist/infrastructure/postgres/data-source.js
        exec node dist/main.js

networks:
  eshop:
    driver: bridge

volumes:
  postgres_data:
