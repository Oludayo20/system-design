services:
  shard-0:
    image: postgres:16-alpine
    container_name: sharding-demo-shard-0
    restart: unless-stopped
    environment:
      POSTGRES_DB: shard_0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - shard0-data:/var/lib/postgresql/data
      - ./src/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shard_0']
      interval: 5s
      timeout: 5s
      retries: 10

  shard-1:
    image: postgres:16-alpine
    container_name: sharding-demo-shard-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: shard_1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - shard1-data:/var/lib/postgresql/data
      - ./src/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shard_1']
      interval: 5s
      timeout: 5s
      retries: 10

  shard-2:
    image: postgres:16-alpine
    container_name: sharding-demo-shard-2
    restart: unless-stopped
    environment:
      POSTGRES_DB: shard_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - shard2-data:/var/lib/postgresql/data
      - ./src/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shard_2']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharding-demo-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      SHARD_COUNT: 3
      SHARDING_STRATEGY: hash
      SHARD_0_HOST: shard-0
      SHARD_0_PORT: 5432
      SHARD_0_DB: shard_0
      SHARD_0_USER: postgres
      SHARD_0_PASSWORD: postgres
      SHARD_1_HOST: shard-1
      SHARD_1_PORT: 5432
      SHARD_1_DB: shard_1
      SHARD_1_USER: postgres
      SHARD_1_PASSWORD: postgres
      SHARD_2_HOST: shard-2
      SHARD_2_PORT: 5432
      SHARD_2_DB: shard_2
      SHARD_2_USER: postgres
      SHARD_2_PASSWORD: postgres
    depends_on:
      shard-0:
        condition: service_healthy
      shard-1:
        condition: service_healthy
      shard-2:
        condition: service_healthy

volumes:
  shard0-data:
  shard1-data:
  shard2-data:
