services:
  postgres:
    image: postgres:16-alpine
    container_name: async-queue-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-async_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-async_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-async_demo}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-async_demo} -d ${POSTGRES_DB:-async_demo}']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: async-queue-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-async_demo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-async_demo_password}
    ports:
      - '5672:5672'
      - '15672:15672' # management UI: http://localhost:15672
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # Kafka broadcast-comparison piece. Not consumed by api/worker — it's exercised standalone via
  # `npm run kafka:produce` / `npm run kafka:consume:*` from the host, against localhost:9092.
  kafka:
    image: bitnami/kafka:3.7
    container_name: async-queue-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ['CMD-SHELL', '/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: async-queue-api
    command: ['node', 'dist/main.js']
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-async_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-async_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-async_demo}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-async_demo}:${RABBITMQ_PASSWORD:-async_demo_password}@rabbitmq:5672
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # No `ports:` — a scaled worker fleet must not fight over a host port.
  # Run: docker compose up -d --scale worker=20
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/worker.main.js']
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-async_demo}:${RABBITMQ_PASSWORD:-async_demo_password}@rabbitmq:5672
      EMAIL_FAILURE_RATE: ${EMAIL_FAILURE_RATE:-0.3}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
