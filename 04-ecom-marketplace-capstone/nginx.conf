# Nginx stands in for Cloudflare + the "Nginx Load Balancer" box in doc.md's
# final diagram. Cloudflare (CDN/edge) is explicitly out of scope for local
# dev - there is no origin-shielding or edge caching here, just round-robin
# load balancing across two identical, stateless API replicas.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream oja_api {
    # Default nginx load-balancing algorithm is round-robin: each new
    # connection is handed to the next server in the list. No sticky
    # sessions are configured on purpose - the API is stateless (auth is a
    # bearer JWT, not a server-side session), so either replica can answer
    # any request.
    server api-1:3000;
    server api-2:3000;
  }

  server {
    listen 8080;

    location /health {
      proxy_pass http://oja_api/health;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://oja_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
