services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-library}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-library} -d ${POSTGRES_DB:-library}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-api
    environment:
      NODE_ENV: production
      PORT: 3011
      # Use Docker service names — not localhost from .env (which is for host-side dev).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-library}
    ports:
      - '3011:3011'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - library
    command:
      - sh
      - -c
      - |
        echo "Waiting for postgres DNS and TCP..."
        i=0
        until node -e "
          const dns = require('dns');
          const net = require('net');
          dns.lookup('postgres', (err, addr) => {
            if (err) process.exit(1);
            const s = net.createConnection(5432, addr, () => { s.end(); process.exit(0); });
            s.on('error', () => process.exit(1));
          });
        "; do
          i=$$((i + 1))
          if [ $$i -ge 60 ]; then echo "postgres not reachable after 60s"; exit 1; fi
          sleep 1
        done
        node ./node_modules/typeorm/cli.js migration:run -d dist/infrastructure/postgres/data-source.js
        exec node dist/main.js

networks:
  library:
    driver: bridge

volumes:
  postgres_data:
